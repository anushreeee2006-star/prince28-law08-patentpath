name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (used for rollback)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.LIVE_URL }}

    env:
      SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run database migrations
        if: github.event_name != 'workflow_dispatch'
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Deploy exact tested image to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${SHA}"
          ENCODED_IMAGE="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE")"
          curl --fail --silent --show-error \
            -X POST "${RENDER_DEPLOY_HOOK}&imgURL=${ENCODED_IMAGE}"

      - name: Smoke test live deployment
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          for attempt in {1..30}; do
            if uv run python scripts/smoke.py "$LIVE_URL" --expected-sha "$SHA"; then
              exit 0
            fi
            echo "Deployment not ready yet (attempt ${attempt}/30). Retrying in 10 seconds..."
            sleep 10
          done
          echo "Smoke test failed after 30 attempts."
          exit 1
